name: Grow contribution garden

on:
  workflow_dispatch:

  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate garden SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: mmlubag
          OUTPUT_FILE: contribution-garden.svg
        run: python3 scripts/generate_garden.py

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: .
          keep_files: false
          exclude_assets: |
            .github
            scripts
            README.md
            assets
